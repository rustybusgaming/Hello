# Render Blueprint for the full Flashhub server: games, accounts, saves, Steam.
# Render: New -> Blueprint -> pick this repository. Values marked `sync: false` are asked for
# when the Blueprint is created.
#
# Before it serves players:
#   1. Add TWO custom domains to this service (Settings -> Custom Domains), e.g.
#      flashhub.example.com and games.example.com. Games are framed from the second one so
#      game code cannot reach the hub's session cookie; the server refuses to start in
#      production without it (see GAME_ORIGIN below).
#   2. Set APP_URL to the first domain and GAME_ORIGIN to the second, both with https://.
#      Sign in through Steam sends players back to APP_URL, so it must be the public address.
#   3. Optional: STEAM_API_KEY (https://steamcommunity.com/dev/apikey) for Steam libraries,
#      playtime and achievements.

services:
  - type: web
    name: flashhub
    runtime: node
    # A persistent disk needs a paid instance; on the free plan data/ (accounts, sessions,
    # saves, play history) is wiped on every deploy and restart.
    plan: starter
    region: oregon
    # Vite and the type definitions are dev dependencies, and NODE_ENV=production would
    # otherwise make npm skip them during the build
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Render puts one proxy in front of the service; this lets per-IP rate limiting see the
      # real client address instead of the proxy's
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      - key: APP_URL
        sync: false
      - key: GAME_ORIGIN
        sync: false
      - key: STEAM_API_KEY
        sync: false
    disk:
      # The server keeps its state in ./data (accounts.json, sessions.json, saves.json, ...)
      name: flashhub-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
