<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Cartridge Not Found | Flash Game Hub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 32px;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 16px;
      background: rgba(9, 9, 11, 0.9);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f87171;
      font-weight: 600;
    }
    h1 { margin: 8px 0 12px; font-size: 24px; letter-spacing: -0.02em; }
    p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #a1a1aa; }
    a.home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #fafafa;
      color: #09090b;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    a.home:hover { background: #e4e4e7; }
  </style>
</head>
<body>
  <div class="card">
    <span class="code">System error code: 404_page_fault</span>
    <h1>Cartridge not found</h1>
    <p>
      The page, game port or cloud save you asked for is not in this catalogue. It may have been
      renamed upstream, hidden by an admin, or the address may contain a typo.
    </p>
    <a class="home" href="/">← Back to the arcade hub</a>
  </div>
</body>
</html>
