<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashHub Ruffle & WebAssembly Player</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #player-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    .overlay-card {
      position: absolute;
      z-index: 20;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid #3f3f46;
      border-radius: 14px;
      padding: 24px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
    }
    .start-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #000;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .start-btn:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }
    .mirror-btn {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
      transition: background 0.2s;
    }
    .mirror-btn:hover {
      background: #3f3f46;
      color: #fff;
    }
    .drop-zone {
      border: 2px dashed #3f3f46;
      border-radius: 10px;
      padding: 16px;
      margin-top: 14px;
      cursor: pointer;
      font-size: 12px;
      color: #a1a1aa;
    }
    .drop-zone:hover {
      border-color: #f59e0b;
      color: #fafafa;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      margin-bottom: 12px;
    }
    #error-banner {
      display: none;
      position: absolute;
      bottom: 20px;
      z-index: 30;
      background: #7f1d1d;
      border: 1px solid #dc2626;
      color: #fecaca;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      max-width: 90%;
      text-align: center;
    }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player-container">
    <div id="start-overlay" class="overlay-card">
      <span class="badge">⚡ Ruffle WebAssembly Engine</span>
      <h2 id="game-title" style="margin: 0 0 8px 0; font-size: 18px; font-weight: 700;">Classic Flash Cartridge</h2>
      <p id="game-desc" style="margin: 0 0 18px 0; font-size: 13px; color: #a1a1aa; line-height: 1.4;">
        Direct client-side Flash emulation running without external plugins.
      </p>

      <button id="start-btn" class="start-btn">
        <span>▶</span> <span>START EMULATION</span>
      </button>

      <div id="mirrors-section" style="margin-top: 16px; display: none;">
        <span style="font-size: 11px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">Alternative Mirror Sources</span>
        <div id="mirrors-list" style="display: flex; flex-wrap: wrap; justify-content: center;"></div>
      </div>

      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        📁 Drag & drop your own .swf file or click to browse
        <input type="file" id="file-input" accept=".swf" style="display: none;">
      </div>
    </div>

    <div id="player"></div>
    <div id="error-banner"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const swfUrl = urlParams.get('swf') || urlParams.get('url');
    const title = urlParams.get('title');
    const mirrorsParam = urlParams.get('mirrors');
    const autoplay = urlParams.get('autoplay') === '1' || urlParams.get('autoplay') === 'true';

    if (title) {
      document.getElementById('game-title').textContent = title;
      document.title = `${title} - FlashHub Player`;
    }

    if (mirrorsParam) {
      try {
        const mirrors = JSON.parse(decodeURIComponent(mirrorsParam));
        if (Array.isArray(mirrors) && mirrors.length > 0) {
          const list = document.getElementById('mirrors-list');
          document.getElementById('mirrors-section').style.display = 'block';
          mirrors.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'mirror-btn';
            btn.textContent = m.name;
            btn.onclick = () => loadSwf(m.url);
            list.appendChild(btn);
          });
        }
      } catch (e) {}
    }

    let rPlayer = null;

    function initRuffle() {
      if (!window.RufflePlayer) {
        showError('Ruffle WebAssembly is initializing. Please click Start again in a moment.');
        return null;
      }
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const container = document.getElementById('player');
      container.innerHTML = '';
      container.appendChild(player);
      player.style.width = '100%';
      player.style.height = '100%';
      return player;
    }

    function loadSwf(url) {
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('error-banner').style.display = 'none';

      try {
        rPlayer = initRuffle();
        if (!rPlayer) return;

        rPlayer.load({
          url: url,
          autoplay: 'on',
          unmuteOverlay: 'hidden',
          letterbox: 'on',
          warnOnUnsupportedContent: false
        }).catch(err => {
          console.warn('Ruffle load issue:', err);
          showError(`Failed to load SWF from mirror: ${err.message || 'Network error'}. Try an alternative mirror.`);
          document.getElementById('start-overlay').style.display = 'block';
        });
      } catch (err) {
        showError(`Emulation initialization error: ${err.message}`);
        document.getElementById('start-overlay').style.display = 'block';
      }
    }

    function loadArrayBuffer(buffer) {
      document.getElementById('start-overlay').style.display = 'none';
      rPlayer = initRuffle();
      if (!rPlayer) return;
      rPlayer.load({
        data: buffer,
        autoplay: 'on',
        unmuteOverlay: 'hidden',
        letterbox: 'on'
      });
    }

    function showError(msg) {
      const b = document.getElementById('error-banner');
      b.textContent = msg;
      b.style.display = 'block';
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      if (swfUrl) {
        loadSwf(swfUrl);
      } else {
        showError('No SWF URL specified. Please choose an alternative mirror or drag a .swf file.');
      }
    });

    if (autoplay && swfUrl) {
      setTimeout(() => loadSwf(swfUrl), 100);
    }

    // Drag and Drop support
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        loadArrayBuffer(e.target.result);
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
