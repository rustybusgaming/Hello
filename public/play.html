<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flash Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #player { width: 100%; height: 100%; }
        #start-btn { position: absolute; z-index: 10; background: #ff8a00; border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; color: #000; transition: transform 0.2s; }
        #start-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <button id="start-btn">▶ PLAY GAME</button>
    <div id="player"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const swfUrl = urlParams.get('swf');
        
        document.getElementById('start-btn').addEventListener('click', function() {
            this.style.display = 'none';
            if (swfUrl) {
                window.RufflePlayer = window.RufflePlayer || {};
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById('player');
                container.appendChild(player);
                player.style.width = '100%';
                player.style.height = '100%';
                player.load({
                    url: swfUrl,
                    autoplay: 'on',
                    unmuteOverlay: 'hidden'
                });
            }
        });
    </script>
</body>
</html>
