<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashHub Ruffle & WebAssembly Player</title>
  <style>
    :root {
      --void: #06070f;
      --surface: #111428;
      --edge: #232845;
      --volt: #8b5cf6;
      --beam: #22d3ee;
    }
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--void);
      background-image: radial-gradient(700px 380px at 50% -10%, rgba(139, 92, 246, 0.22), transparent 65%);
      color: #f4f4f5;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #player-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #player { width: 100%; height: 100%; }
    .overlay-card {
      position: absolute;
      z-index: 20;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)), var(--surface);
      border: 1px solid var(--edge);
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
    }
    .start-btn {
      background: linear-gradient(135deg, var(--volt), #4f46e5);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 12px 30px -12px rgba(139, 92, 246, 0.95);
      transition: filter 0.15s, transform 0.15s;
    }
    .start-btn:hover { filter: brightness(1.08); }
    .start-btn:active { transform: translateY(1px); }
    .mirror-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #d4d0dc;
      border: 1px solid var(--edge);
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      margin: 4px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .mirror-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,138,0,0.4); color: #fff; }
    .drop-zone {
      border: 1px dashed #35313f;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      cursor: pointer;
      font-size: 12px;
      color: #8b8794;
      transition: border-color 0.2s, color 0.2s;
    }
    .drop-zone:hover { border-color: var(--volt); color: #fafafa; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(139, 92, 246, 0.15);
      color: var(--volt);
      border: 1px solid rgba(139, 92, 246, 0.35);
      margin-bottom: 14px;
    }
    #error-banner {
      display: none;
      position: absolute;
      bottom: 20px;
      z-index: 30;
      background: rgba(127, 29, 29, 0.9);
      border: 1px solid #dc2626;
      color: #fecaca;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      max-width: 90%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
  </style>
  <!-- The server inlines the game-storage bridge above this point; see server/frameStorage.ts -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="player-container">
    <div id="start-overlay" class="overlay-card">
      <span class="badge">⚡ Ruffle WASM</span>
      <h2 id="game-title" style="margin: 0 0 8px 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Classic Flash Cartridge</h2>
      <p id="game-desc" style="margin: 0 0 18px 0; font-size: 13px; color: #a1a1aa; line-height: 1.4;">
        Client-side Flash emulation. No plugins, no downloads — the .swf streams straight into WebAssembly.
      </p>

      <button id="start-btn" class="start-btn">
        <span>▶</span> <span>START GAME</span>
      </button>

      <div id="mirrors-section" style="margin-top: 16px; display: none;">
        <span style="font-size: 11px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">Alternative Mirror Sources</span>
        <div id="mirrors-list" style="display: flex; flex-wrap: wrap; justify-content: center;"></div>
      </div>

      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        📁 Drag & drop your own .swf file or click to browse
        <input type="file" id="file-input" accept=".swf" style="display: none;">
      </div>
    </div>

    <div id="player"></div>
    <div id="error-banner"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const swfUrl = urlParams.get('swf') || urlParams.get('url');
    const title = urlParams.get('title');
    const mirrorsParam = urlParams.get('mirrors');
    const autoplay = urlParams.get('autoplay') === '1' || urlParams.get('autoplay') === 'true';

    if (title) {
      document.getElementById('game-title').textContent = title;
      document.title = `${title} - FlashHub Player`;
    }

    if (mirrorsParam) {
      try {
        // URLSearchParams already percent-decodes the value; decoding twice corrupts
        // any payload that legitimately contains an escaped '%'.
        const mirrors = JSON.parse(mirrorsParam);
        if (Array.isArray(mirrors) && mirrors.length > 0) {
          const list = document.getElementById('mirrors-list');
          document.getElementById('mirrors-section').style.display = 'block';
          mirrors.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'mirror-btn';
            btn.textContent = m.name;
            btn.onclick = () => loadSwf(m.url);
            list.appendChild(btn);
          });
        }
      } catch (e) {}
    }

    let rPlayer = null;

    function initRuffle() {
      if (!window.RufflePlayer) {
        showError('Ruffle WebAssembly is initializing. Please click Start again in a moment.');
        return null;
      }
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const container = document.getElementById('player');
      container.innerHTML = '';
      container.appendChild(player);
      player.style.width = '100%';
      player.style.height = '100%';
      return player;
    }

    function loadSwf(url) {
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('error-banner').style.display = 'none';

      try {
        rPlayer = initRuffle();
        if (!rPlayer) {
          document.getElementById('start-overlay').style.display = '';
          return;
        }

        rPlayer.load({
          url: url,
          autoplay: 'on',
          unmuteOverlay: 'hidden',
          letterbox: 'on',
          warnOnUnsupportedContent: false
        }).catch(err => {
          console.warn('Ruffle load issue:', err);
          showError(`Failed to load SWF from mirror: ${err.message || 'Network error'}. Try an alternative mirror.`);
          document.getElementById('start-overlay').style.display = '';
        });
      } catch (err) {
        showError(`Emulation initialization error: ${err.message}`);
        document.getElementById('start-overlay').style.display = '';
      }
    }

    function loadArrayBuffer(buffer) {
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('error-banner').style.display = 'none';
      rPlayer = initRuffle();
      if (!rPlayer) {
        document.getElementById('start-overlay').style.display = '';
        return;
      }
      rPlayer.load({
        data: buffer,
        autoplay: 'on',
        unmuteOverlay: 'hidden',
        letterbox: 'on'
      });
    }

    function showError(msg) {
      const b = document.getElementById('error-banner');
      b.textContent = msg;
      b.style.display = 'block';
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      if (swfUrl) {
        whenStorageReady(() => loadSwf(swfUrl));
      } else {
        showError('No SWF URL specified. Please choose an alternative mirror or drag a .swf file.');
      }
    });

    // Wait for the hub to seed saved progress before booting, so Ruffle reads the player's
    // SharedObjects rather than starting from a blank slate. The bridge always resolves,
    // falling back to empty storage if the hub does not answer.
    function whenStorageReady(run) {
      const bridge = window.__flashhubStorage;
      if (!bridge || bridge.ready) {
        run();
        return;
      }
      let done = false;
      const go = () => { if (!done) { done = true; run(); } };
      window.addEventListener('flashhub:storage-ready', go, { once: true });
      setTimeout(go, 2000);
    }

    if (autoplay && swfUrl) {
      whenStorageReady(() => setTimeout(() => loadSwf(swfUrl), 60));
    }

    // Drag and Drop support
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      if (!/\.swf$/i.test(file.name)) {
        showError(`"${file.name}" is not a .swf file.`);
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        loadArrayBuffer(e.target.result);
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
